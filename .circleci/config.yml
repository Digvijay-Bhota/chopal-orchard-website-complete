version: 2.1

orbs:
  node: circleci/node@5.2

jobs:
  build:
    docker:
      - image: cimg/node:22.13.1

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: npm ci

      - run:
          name: Deploy to Vercel
          command: |
            npx vercel --token "$VERCEL_TOKEN" --prod --yes

      - run:
          name: Deploy to Netlify
          command: |
            npx netlify-cli deploy \
              --auth "$NETLIFY_TOKEN" \
              --site "$NETLIFY_SITE_ID" \
              --prod

workflows:
  sample:
    jobs:
      - build
